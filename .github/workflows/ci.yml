name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest tests -q -p no:cacheprovider
          python -m coverage report --fail-under=80
          python -m coverage json -o coverage.json
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.json
          retention-days: 14

  # Publishes a shields.io endpoint JSON to the `badges` branch so the README badge
  # needs no third-party coverage service or token. Only runs for pushes to main.
  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # update coverage.json on the badges branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Write badge JSON to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pct=$(python3 -c 'import json; print(round(json.load(open("coverage.json"))["totals"]["percent_covered"]))')
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 80 ]; then color=green
          elif [ "$pct" -ge 70 ]; then color=yellow
          else color=red; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > badge.json
          sha=$(gh api "repos/$REPO/contents/coverage.json?ref=badges" --jq .sha 2>/dev/null || true)
          args=(-f message="coverage ${pct}%" -f branch=badges -f content="$(base64 -w0 badge.json)")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api -X PUT "repos/$REPO/contents/coverage.json" "${args[@]}" --jq .commit.sha

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff (pinned in requirements-dev.txt)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: ruff check
        run: ruff check . --output-format=github

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh systemd/*.sh

  systemd-units:
    name: systemd unit verification
    # Pinned image: systemd-analyze output differs between systemd releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: systemd-analyze verify
        run: |
          set -euo pipefail
          systemd-analyze --version | head -n1
          work="$(mktemp -d)"
          cp systemd/*.service systemd/*.path "$work/"
          # Paths that only exist after install.sh are pointed at real files so that
          # systemd-analyze can check the Exec*= lines: the venv interpreter becomes
          # the system python3, /opt/water-bacnet/libexec/X becomes the repo's systemd/X.
          sed -i \
            -e "s#/opt/water-bacnet/venv/bin/python#/usr/bin/python3#g" \
            -e "s#/opt/water-bacnet/libexec/#${PWD}/systemd/#g" \
            "$work"/*
          if grep -nE '^Exec[A-Za-z]*=[-@:+!]*/opt/' "$work"/*; then
            echo "::error::a unit references an install-time path this job does not map"
            exit 1
          fi
          rc=0
          out="$(cd "$work" && systemd-analyze verify --man=no --recursive-errors=no ./*.service ./*.path 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # verify exits 0 on many warnings (unknown keys, bad values), so also
          # fail on any message that names one of our units.
          if [ "$rc" -ne 0 ] || printf '%s\n' "$out" | grep -qE 'water-bacnet[^ ]*\.(service|path)'; then
            echo "::error::systemd-analyze verify reported problems"
            exit 1
          fi
          echo "systemd units OK"
